# Pins in pyproject.toml are exact, so nothing moves unless something proposes it. Grouped
# weekly PRs keep that to one review a week; CI runs the full gate on each.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
