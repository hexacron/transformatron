[project]
name = "transformatron"
version = "0.1.0"
description = "MCP control plane for a local Maltego v3 transform server"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.15"
dependencies = [
    "mcp==2.3.0",
    # maltego-transforms 1.3.0 accepts httpx>=0.27.2,<0.29.0.
    "httpx==0.28.1",
    "maltego-transforms==1.4.0",
    # 1.0.2 requires maltego-transforms>=1.3.0, so the two move together.
    "maltego-transforms-std-entities==1.0.3",
    # OpenAPI specs are as often YAML as JSON.
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.1",
    "ruff==0.17.3",
    "ty==0.0.92",
    "types-pyyaml==6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transformatron"]

[tool.ruff]
line-length = 100
target-version = "py313"
# The SDK owns the files it generates under server/ (.agents/, project.py, __init__.py) —
# linting them would churn against upstream on every regeneration. Everything else under
# server/ (transforms/, middleware.py, discovery.py) is project code and is linted.
extend-exclude = [
    "server/.agents",
    "server/project.py",
    "server/__init__.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
